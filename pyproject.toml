[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samuged-phrases"
version = "0.2.0"
description = "Reproducible extraction of recurring symbolic melodic phrases"
requires-python = ">=3.11"
dependencies = ["mido==1.3.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.25,<5", "mir_eval==0.8.2"]
research = ["mir_eval==0.8.2"]
report = ["reportlab>=4,<6", "matplotlib>=3.9,<4", "pypdf>=5,<7"]
legacy = ["miditoolkit==1.0.1", "numpy>=2,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.scripts]
samuged = "samuged.cli:main"

[tool.setuptools.packages.find]
include = ["samuged*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
